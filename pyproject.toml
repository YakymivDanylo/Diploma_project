[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diploma-blockchain"
version = "0.1.0"
description = "Decentralized document verification system on a custom blockchain"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["blockchain_core"]

[tool.hatch.build.targets.wheel]
packages = ["src/blockchain_core"]